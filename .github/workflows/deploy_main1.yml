name: Deploy main1 to Hostinger

on:
  push:
    branches: [ main1 ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy main1 (Clean Slate)
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🔨 Build Assets
      run: |
        npm ci
        npm run build

    - name: 📦 Create Deployment Artifact
      run: |
        tar --ignore-failed-read --warning=no-file-changed -czf deploy_main1.tar.gz \
          --exclude=.git \
          --exclude=.github \
          --exclude=node_modules \
          --exclude=tests \
          --exclude=maintenance \
          --exclude=.env \
          --exclude=deploy_main1.tar.gz \
          --exclude=storage/logs \
          --exclude=storage/framework/sessions \
          .

    - name: 📤 Transfer to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOSTINGER_IP }}
        username: ${{ secrets.HOSTINGER_USER }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: ${{ secrets.HOSTINGER_PORT }}
        source: "deploy_main1.tar.gz"
        target: "domains/losfit.com.br/public_html"

    - name: 🚀 Remote Setup & Cleanup
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTINGER_IP }}
        username: ${{ secrets.HOSTINGER_USER }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          TARGET_DIR="domains/losfit.com.br/public_html"
          PHP_BIN="/opt/alt/php84/usr/bin/php"
          COMPOSER_BIN="/usr/local/bin/composer"

          echo "--- Starting Clean Deploy of main1 ---"
          cd $TARGET_DIR
          
          # Backup critical files
          [ -f .env ] && cp .env .env.bak
          [ -f .htaccess ] && cp .htaccess .htaccess.bak
          
          echo "1. Deleting all existing files..."
          # Delete everything except backups and the new package
          find . -maxdepth 1 ! -name '.env.bak' ! -name '.htaccess.bak' ! -name 'deploy_main1.tar.gz' ! -name '.' ! -name '..' -exec rm -rf {} +
          
          echo "2. Extracting new code..."
          tar -xzf deploy_main1.tar.gz
          rm deploy_main1.tar.gz
          
          # Restore critical files
          [ -f .env.bak ] && mv .env.bak .env
          [ -f .htaccess.bak ] && mv .htaccess.bak .htaccess
          
          echo "3. Synchronizing Database..."
          if [ -f backup_losfit.sql ]; then
              echo "Importing backup_losfit.sql (52 tables)..."
              # Using 127.0.0.1 and --force to handle existing tables
              mysql -h 127.0.0.1 -u u488238372_losfit -p'!Sa002125' u488238372_losfit --force < backup_losfit.sql > mysql_import.log 2>&1
              if [ $? -eq 0 ]; then
                  echo "✅ Database import command finished."
                  TABLE_COUNT=$(mysql -h 127.0.0.1 -u u488238372_losfit -p'!Sa002125' -e "SHOW TABLES" u488238372_losfit | wc -l)
                  echo "📊 Total tables after import: $((TABLE_COUNT-1))"
                  rm backup_losfit.sql
                  rm mysql_import.log
              else
                  echo "❌ Database import FAILED. Details:"
                  cat mysql_import.log
              fi
          else
              echo "⚠️ backup_losfit.sql not found."
          fi

          echo "4. Synchronizing Images..."
          if [ -f imagens_losfit.zip ]; then
              mkdir -p storage/app/public
              unzip -o imagens_losfit.zip -d storage/app/public
              rm imagens_losfit.zip
              echo "Images extracted successfully."
          fi

          echo "5. Installing dependencies..."
          $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
          
          echo "6. Running Migrations..."
          $PHP_BIN artisan migrate --force
          
          echo "7. Optimizing and Permissions..."
          $PHP_BIN artisan optimize:clear
          $PHP_BIN artisan storage:link
          
          chmod -R 775 storage bootstrap/cache
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod -R 777 storage bootstrap/cache

          echo "--- DEPLOY main1 COMPLETED SUCCESSFULLY ---"
